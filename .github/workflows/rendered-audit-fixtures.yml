name: One-shot isolated rendered audit fixtures
on:
  push:
    branches: [codex/rendered-audit-feasibility]
    paths: [experiments/rendered-audit/ci/run-20261026-c46a892e.trigger]
permissions:
  contents: read
concurrency:
  group: rendered-audit-fixtures
  cancel-in-progress: false
jobs:
  fixtures:
    if: github.event_name == 'push' && github.repository == 'ayaibrahi/HVAC-SAAS' && github.ref == 'refs/heads/codex/rendered-audit-feasibility' && github.event.repository.private == false && github.event.forced == false && github.event.deleted == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout fixture source only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: experiments/rendered-audit
          sparse-checkout-cone-mode: true
      - name: Require one new marker on the approved baseline
        shell: bash
        run: |
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git show -s --format=%P HEAD)" == '75a49a86e7b99d2d002d9b8f36bb9d89d42bdc88' ]]
          marker=experiments/rendered-audit/ci/run-20261026-c46a892e.trigger
          [[ "$(git diff-tree --no-commit-id --name-status -r HEAD -- "$marker")" == $'A\t'"$marker" ]]
          [[ "$(cat "$marker")" == 'scanvoro-offline-fixtures-20261026-c46a892e' ]]
      - name: Build and run one offline container
        shell: bash
        run: bash experiments/rendered-audit/ci/run-linux.sh
