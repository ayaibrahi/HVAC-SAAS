name: One-shot isolated worker application acceptance
on:
  push:
    branches: [codex/rendered-audit-integration]
    paths: [workers/rendered-audit/run-20261101-worker-fix.trigger]
permissions:
  contents: read
jobs:
  worker:
    if: github.event_name == 'push' && github.repository == 'ayaibrahi/HVAC-SAAS' && github.ref == 'refs/heads/codex/rendered-audit-integration' && github.event.repository.private == false && github.event.forced == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Require approved parent and new marker
        shell: bash
        run: |
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git show -s --format=%P HEAD)" == '9b5cfee78bab5ea5ca84f2d82650ed9211b1b120' ]]
          marker=workers/rendered-audit/run-20261101-worker-fix.trigger
          [[ "$(git diff-tree --no-commit-id --name-status -r HEAD -- "$marker")" == $'A\t'"$marker" ]]
          [[ "$(cat "$marker")" == 'scanvoro-broker-only-worker-fix-20261101' ]]
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000
      - name: Verify immutable policy and adapter security assertions
        run: node node_modules/vitest/vitest.mjs run src/features/audits/worker/linux-worker.test.ts src/features/audits/worker/startup-diagnostics.test.ts --maxWorkers=1
      - name: Real isolated worker through application and PostgreSQL
        run: bash workers/rendered-audit/run-linux-acceptance.sh
